apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
      - name: app2
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: app2-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-html
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>App 2</title>
      <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #e74c3c; color: white; }
        h1 { font-size: 3em; }
      </style>
    </head>
    <body>
      <h1>🎯 Application 2</h1>
      <p>This is App 2 running on K3s (with 3 replicas)</p>
      <p>Hostname: <%= hostname %></p>
    </body>
    </html>

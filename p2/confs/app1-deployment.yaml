apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: app1
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: app1-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-html
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>App 1</title>
      <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #3498db; color: white; }
        h1 { font-size: 3em; }
      </style>
    </head>
    <body>
      <h1>🚀 Application 1</h1>
      <p>This is App 1 running on K3s</p>
    </body>
    </html>
